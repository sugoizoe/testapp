name: datenow_mobile
description: Datenow mobile app (Flutter) consuming Go backend.
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  dio: ^5.6.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  appinio_swiper: ^2.1.1
  mobile_scanner: ^3.5.6
  pinput: ^4.0.0
  qr_flutter: ^4.1.0
  lottie: ^3.1.2
  cryptography: ^2.7.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

